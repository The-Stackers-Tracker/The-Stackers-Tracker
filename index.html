function helpsec(){const H=(t,b)=>`<details><summary>${t}</summary><p>${b}</p></details>`;return`<h2>Help &amp; About</h2><div class="c"><div style="display:flex;gap:12px;align-items:center"><div style="width:44px;height:44px;flex:none">${LOGO}</div><div><b>The Stackers Tracker</b><div class="mu">Version ${APPV} · build ${APPB} · ${APPD}</div></div></div>${instsec()}<button class="b g" style="margin-top:10px" onclick="wreplay()">Replay the Walkthrough</button> <button class="b g" style="margin-top:10px" onclick="wnall()">What's New</button></div><div class="c hlp"><details><summary>Installing the App</summary><div class="hlpb">${`Open <b>${location.protocol=='https:'?location.host+location.pathname.replace(/index\.html$/,''):'the-stackers-tracker.github.io/The-Stackers-Tracker/'}</b> on the device, then follow the steps for it.${['and','ios','desk'].map(k=>`<b class="insh">${INS[k][0]}</b>${insl(k)}`).join('')}On a new device your stack starts empty. Import your backup file (Settings → Backup) to bring it over.`}</div></details>${H('Adding an Item','Tap the round <b>+</b> button. Choose the type and the metal, describe the item, then pick a coin type (for circulated coins) or enter the weight of one piece. Add what you paid, the date and where you bought it.')}<details><summary>Item Types</summary><div class="hlpb">Every item has a type:${tylist()}For jewellery and silverware the app works out the pure metal from the weight and purity. Inventory can be filtered and sorted by type, and the Category slide on the Dashboard can show your stack By Type.</div></details>
${H('Recording a Sale or Gift','Open the item and tap <b>Mark as Sold or Gift</b>. If you sold only some pieces, enter how many; The Stackers Tracker splits the item and its cost for you. If you gave it away, choose <b>Gift</b>: add the date and, if you like, who it went to. A gift has no sale price, isn’t counted as a loss, and keeps a note of what the metal was worth that day.')}
${H('Spot Prices','With a MetalpriceAPI key, prices update automatically (Settings → Auto-update). Without one, type them in Settings → Spot Prices. Tap a price on the Spot Prices page to check it online.')}
${H('Collector Values','Add a Numista key in Settings. Then, while adding or editing a coin, tap <b>Find on Numista</b> in the Collector Value section (or open a saved coin and tap <b>Link to Numista</b>): find the coin, pick its year and condition. If you ticked Graded, the matching condition is marked. Adding another of a coin you already linked? Tap <b>Use the Same Link</b>, which uses no requests. A linked coin shows both numbers: its melt value and the Numista estimate (which can be above or below melt). Your totals and profit stay based on melt. In Inventory, open Filters and use <b>Numista</b> to see linked coins, coins worth more or less than melt, or ones with no estimate, and sort by <b>Numista estimate</b> or <b>Most above melt</b>. My Stack shows a <b>Collector Coins</b> box with both totals.')}
${H('Banknotes and Stamps','Choose <b>Banknote</b> or <b>Stamp</b> as the type when you add one. They have no metal, so the metal and weight boxes go away. Enter the country, face value, year and serial number instead (stamps get a catalogue number, condition, format and a link). Add <b>My value</b> for what one is worth. Banknotes can also be linked with <b>Find on Numista</b>, and its estimate is then used instead. Banknotes and stamps are kept out of your melt value, metal profit and break-even. My Stack shows them in their own <b>Banknotes and Stamps</b> box, the Category slide has its own tab, and the first Inventory filter can show just them.')}
${H('Making a Report for Insurance or Police','Open the <b>Reports</b> slide on the Dashboard and tap <b>Generate Report</b>. Under <b>Report For</b>, choose <b>General</b> (your own records), <b>Insurance</b> (a full list for your insurer) or <b>Police</b> (a “Stolen Items List”). Each choice ticks the right boxes, and you can change any of them. <b>Which Items</b> lets you include everything, only what was stored in one place, or items you pick. <b>Full item details</b> adds the year, maker, grade, serial number, where it was stored and where you bought it, and every item gets a number you can refer to on a claim form. Photos you added to your items appear under them. Fill in <b>Your Details</b> once and they’re remembered. Insurance and Police reports end with a signature line. Use <b>Print / PDF</b> or <b>Download</b> to send it; saved copies leave the photos out. Tip: make an Insurance report once a year and keep a copy somewhere other than your phone, like your email.')}
${H('Premium Over Spot','The <b>Premium</b> slide on the Dashboard shows how much more than the metal value you paid, compared with the spot price on the day you bought. Pick a metal at the top, or <b>Owned Only</b> to leave out what you sold. You’ll see your average, a line for each item type, and your lowest and highest buys. Older purchases use a built-in monthly spot price estimate (marked ≈) when there’s no daily price for that day. For buys from the last 30 days, <b>Fill In Last 30 Days</b> gets the exact daily price with your free MetalpriceAPI key, and <b>Get Exact Daily Prices</b> does the same for older buys if you have a paid plan. You can also type the price from your receipt under Edit → Purchase → <b>Spot price when bought</b>. Inventory can sort by premium too.')}
${H('Goals and Date Sets','Goals track pieces or weight you want to reach. Date sets (from a country’s coin list) let you tick off each year you’ve found.')}
${H('Hiding Amounts','Tap the eye button on the dashboard or in Inventory to blur every amount and weight. Tap it again to show them.')}
${H('Backups and New Phones','Settings → Backup → <b>Export</b> saves one file with everything, photos included. Keep it somewhere safe. On a new phone, open The Stackers Tracker and import that file.')}
${H('Privacy','No account and no tracking. Your data stays in this browser. The Stackers Tracker only connects to MetalpriceAPI and Numista, using your own keys, to fetch prices.')}
${H('Credits','Spot prices from MetalpriceAPI. Collector estimates and coin catalogue from Numista. The Stackers Tracker is not affiliated with either.')}</div><div class="c"><b>Send Feedback</b><p class="mu" style="margin:4px 0 10px">Ideas, problems or questions? Send an email. It helps to say what phone or computer you use.</p><a class="fbb" href="${fbmail()}">✉️ Send Feedback</a><div class="mu" style="margin-top:8px;overflow-wrap:anywhere">Or write to <b>${FBM}</b></div></div>`}

return`<div class="dt" id="dt">${SPG.map((t,i)=>`<button class="${i==ss?'on':''}" onclick="go(${i})">${t}</button>`).join('')}</div><div class="sw ssw" id="sw" onscroll="dots()"><div class="sl">${helpsec()}</div><div class="sl"><h2>Metals I Track</h2><div class="c"><div class="mu">Only the metals ticked here appear on the dashboard and in lists.</div><div class="mck">${MK.map(m=>`<label><input type="checkbox" ${mets().includes(m)?'checked':''} onchange="msetchg('${m}',this)">${m}</label>`).join('')}</div></div><h2 id="spx" style="scroll-margin-top:12px">Spot Prices</h2><div class="c"><div class="mu" id="sst">${esc(stat())}</div>${curui('sc')}${mets().map(cad).join('')}${cur()=='USD'?'':`<label>Exchange rate (${cur()} per US$1)</label><input type="number" step="any" value="${esc(s.fx)}" onchange="fxchg(this)">`}<div class="row" style="margin-top:10px"><button class="b" onclick="live()">Fetch Live Prices</button></div></div><h2 id="aup" style="scroll-margin-top:12px">Auto-update</h2><div class="c"><label>Update prices automatically</label><select onchange="S.set.auto=this.value;save()">${au.map(o=>`<option value="${o[0]}" ${(s.auto||'day')==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select><label>MetalpriceAPI key (stored only on this device)</label><div class="row"><input id="apik" type="password" value="${esc(s.key)}" onchange="keychg(this)"><button class="b g" style="flex:0 0 auto" onclick="eye()">👁</button></div><p class="mu" style="margin:4px 0 0">Get a key at metalpriceapi.com. The <b>free plan</b> gives <b>100 price requests a month</b>, its prices are <b>delayed by 24 hours</b>, and it covers silver, gold, platinum and palladium only (not rhodium or copper). Keep auto-update at “Once a day” to stay within the limit.</p><p class="mu">Each price fetch uses 1 request. “Once an hour” or “Every time I open the app” can use up a free plan’s 100 requests before the month ends.</p></div><h2 id="spl" style="scroll-margin-top:12px">Spot Price Links</h2><div class="c"><p class="mu" style="margin:0 0 4px">The website that opens when you tap a spot price. Each metal starts with a site for your currency. To use your own, type its address. Leave a box empty to use the default.</p>${mets().map(splrow).join('')}</div><h2>Selling Price</h2><div class="c"><label>How buyers pay you</label><select onchange="setsm(this.value)"><option value="pct" ${s.sellm!='off'?'selected':''}>Percent of spot</option><option value="off" ${s.sellm=='off'?'selected':''}>Fixed amount below spot per ${us()}</option></select><div id="sbox">${sellbox()}</div></div></div><div class="sl"><h2>Coin Types</h2><div class="c"><div class="mu">${S.coins.length} coin types for circulated coins, in silver or gold. Add, change or remove them here.</div><div class="row" style="margin-top:8px"><button class="b" onclick="cmgr()">Manage Coin Types</button></div></div>${placeSec()}${gszsec()}${mnsec()}${nsetsec()}</div><div class="sl"><h2>Weights</h2><div class="c"><label style="margin-top:0">Weight unit</label><div class="dt" id="un" style="margin:0 0 4px">${[['oz','Troy Ounces'],['g','Grams']].map(([a,l])=>`<button class="${(s.unit||'oz')==a?'on':''}" onclick="setUnit('${a}')">${l}</button>`).join('')}</div><p class="mu" style="margin:0">Precious metals are weighed in troy ounces (ozt): 1 ozt = 31.1035 g. Spot and selling prices convert automatically.${mets().includes('Copper')?' Copper is weighed in regular ounces (oz, 28.35 g) and pounds, and its spot price is shown per pound (lb), the way copper is sold.':''}</p></div><h2>Appearance</h2><div class="c"><label style="margin-top:0">Text size</label><div class="dt" id="ts" style="margin:0 0 4px">${[['s','Small'],['m','Normal'],['l','Large'],['x','XL']].map(([a,l])=>`<button class="${(s.tsz||'m')==a?'on':''}" onclick="setTsz('${a}')">${l}</button>`).join('')}</div><label>Theme</label><div class="dt" id="th" style="margin:0">${['auto','light','dark','silver','gold'].map(t=>`<button class="${(s.theme||'auto')==t?'on':''}" onclick="setTheme('${t}')">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></div></div><div class="sl"><h2 id="bk" style="scroll-margin-top:12px">Backup</h2><div class="c"><div class="mu">Last backup: ${lb}</div><label>Remind me to back up</label><select onchange="S.set.bkf=this.value;save();pkeep()">${BKF.map(([k,l])=>`<option value="${k}" ${(s.bkf||'m')==k?'selected':''}>${l}</option>`).join('')}</select>${s.bkf=='dom'?`<label>Day of the month</label><select onchange="S.set.bkd=+this.value;save();pkeep()">${Array.from({length:28},(_,i)=>`<option value="${i+1}" ${(+s.bkd||1)==i+1?'selected':''}>${i+1}</option>`).join('')}</select>`:''}<p class="mu" style="margin:4px 0 0">${bkdue()?'A backup is due now. It shows in Dashboard → Actions.':'Next reminder: '+fdt(bknext())+'.'}${s.bkf=='dom'?' Days 1 to 28 work in every month.':''}</p><div class="row" style="margin-top:8px"><button class="b" onclick="exp()">Export</button><button class="b g" onclick="cp()">Copy</button><button class="b g" onclick="csv()">CSV</button></div><label>Import a backup file</label><input type="file" onchange="imp(this.files[0])"><div class="row" style="margin-top:8px"><button class="b g" onclick="pst()">Paste Backup Instead</button></div><p class="mu">Data lives only in this browser. Export regularly.</p></div><h2>Danger Zone</h2><div class="c">${S.undo?`<button class="b g" onclick="undocur()">Undo Currency Change (${esc(S.undo.from)} → ${esc(S.undo.to)})</button><p class="mu">Restores everything as it was before that change.</p>`:''}<button class="b d" onclick="reset()">Reset All Data</button><p class="mu">Erases everything and returns the app to a brand-new state: inventory, goals, date sets, coin types, places, reports, price history and all settings. Export a backup first.</p></div></div></div>`}
async function live(){const k=S.set.key;if(!k)return toast('Enter your API key first');try{const all=mets().length?mets():['Silver','Gold'],nl=S.set.nolive||[],want=all.filter(m=>!nl.includes(m)),skip=all.filter(m=>nl.includes(m)),tries=[want,want.filter(m=>!PAID.includes(m))].filter((a,i,A)=>a.length&&A.findIndex(b=>b.join()==a.join())==i);let j,r,err,used;for(const L of tries){j=await(await fetch(`https://api.metalpriceapi.com/v1/latest?api_key=${encodeURIComponent(k)}&base=USD&currencies=${L.map(m=>XC[m]).join(',')}${cur()=='USD'?'':','+cur()}`)).json();r=j.rates;if(j.success&&r){used=L;break}err=new Error(j.error?.message||j.error?.info||j.message||'unexpected reply from the price service')}if(!used)throw err;if(used.length<want.length){S.set.nolive=[...new Set([...nl,...want.filter(m=>!used.includes(m))])]}
const c=cur(),fx=c=='USD'?1:(r[c]||r['USD'+c]||S.set.fx);S.set.fx=fx;S.set.spot=S.set.spot||{};const miss=[];want.forEach(m=>{const x=XC[m],u=r['USD'+x]||(r[x]?1/r[x]:0);if(u>0)S.set.spot[m]=u*fx*(m=='Copper'?AVR:1);else miss.push(m)});S.set.asOf=new Date((j.timestamp||Date.now()/1e3)*1e3).toISOString().slice(0,10);S.set.last=S.set.lastFetch=Date.now();S.set.src='live';S.set.err=0;save();snap();render();miss.push(...skip.filter(m=>!miss.includes(m)));toast(miss.length?'Spot prices updated, except '+(miss.length>1?miss.slice(0,-1).join(', ')+' and '+miss.at(-1):miss[0]).toLowerCase()+' (not available with your price plan; enter '+(miss.length>1?'them':'it')+' by hand in Settings)':'Spot prices updated')}
catch(e){S.set.err=Date.now();S.set.errMsg=e instanceof TypeError?'blocked or offline':e.message;save();spu();toast('Couldn’t fetch prices: '+(e instanceof TypeError?'request blocked or no connection. Check you’re online, and open The Stackers Tracker in your web browser rather than inside another app.':e.message))}}
